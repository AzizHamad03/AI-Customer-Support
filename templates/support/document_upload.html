{% extends "base.html" %}

{% block title %}Upload document{% endblock %}

{% block content %}
<p class="eyebrow">Knowledge base</p>
<h1>Upload document</h1>
<p class="intro">
    Add store policies or product information for the assistant.
</p>

<section class="panel">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="actions">
            <button class="button" type="submit">Upload document</button>
            <a class="button secondary"
               href="{% url 'support:document_list' %}">
                Cancel
            </a>
        </div>
    </form>
</section>
{% endblock %}
